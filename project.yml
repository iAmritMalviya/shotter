name: Shotter
options:
  bundleIdPrefix: com.amrit
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Shotter:
    type: application
    platform: macOS
    sources:
      - path: Shotter
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amrit.Shotter
        PRODUCT_NAME: Shotter
        INFOPLIST_FILE: Shotter/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shotter/Shotter.entitlements
        # Signed with a local self-signed certificate (see setup-signing.sh) rather than
        # ad-hoc. Ad-hoc signing changes the code-directory hash on every build, and macOS TCC
        # keys the Screen Recording grant on the signing identity — so every rebuild silently
        # revoked the permission and capture failed with SCStreamErrorDomain -3801. A constant
        # identity keeps the grant across rebuilds.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Shotter Local Signing"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Shotter/Shotter.entitlements
