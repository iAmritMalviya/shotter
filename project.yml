name: Shotter
options:
  bundleIdPrefix: com.amrit
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Shotter:
    type: application
    platform: macOS
    sources:
      - path: Shotter
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amrit.Shotter
        PRODUCT_NAME: Shotter
        INFOPLIST_FILE: Shotter/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shotter/Shotter.entitlements
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
          # Ad-hoc. Debug builds are not the ones tested against /Applications, so they do not
          # need the stable identity — and this keeps a fresh clone buildable before anyone has
          # run setup-signing.sh.
          CODE_SIGN_IDENTITY: "-"
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          # Signed with the local certificate from setup-signing.sh. Ad-hoc signing makes the
          # designated requirement the code-directory hash, which changes every build, so macOS
          # TCC silently revokes the Screen Recording grant and capture fails with
          # SCStreamErrorDomain -3801. A fixed certificate keeps the requirement constant.
          CODE_SIGN_IDENTITY: "Shotter Local Signing"
    entitlements:
      path: Shotter/Shotter.entitlements
